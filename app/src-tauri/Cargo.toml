[package]
name = "kestrel"
description = "Kestrel: a free, honest FPS optimiser for VALORANT"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "kestrel_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kestrel-core = { path = "../../crates/kestrel-core" }
kestrel-probe = { path = "../../crates/kestrel-probe" }
kestrel-bench = { path = "../../crates/kestrel-bench" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
tempfile = "3.27.0"
