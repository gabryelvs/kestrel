[package]
name = "kestrel-tweaks"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
kestrel-core = { path = "../kestrel-core" }
kestrel-probe = { path = "../kestrel-probe" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Restore", "Win32_System_SystemInformation", "Win32_System_Threading"] }
winreg = "0.56.0"
wmi = "0.18.4"

[dev-dependencies]
tempfile = "3.27.0"
