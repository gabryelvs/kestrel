name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core logic (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p kestrel-core -p kestrel-probe -p kestrel-bench --locked -- -D warnings
      - run: cargo test -p kestrel-core -p kestrel-probe -p kestrel-bench --locked

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  app-macos:
    name: App tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # The app crate embeds app/dist, so the UI is built first. Its tests use fakes, not Windows code, so they run here.
      - run: npm run build
        working-directory: app
      - run: cargo test -p kestrel --locked
      - run: cargo clippy -p kestrel --locked --all-targets -- -D warnings

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: cargo clippy -p kestrel-probe -p kestrel-bench --locked --all-targets -- -D warnings
      - run: cargo test -p kestrel-core -p kestrel-probe -p kestrel-bench --locked
      - name: Probe this runner (smoke test)
        run: cargo run --locked -q -p kestrel-probe --bin kestrel-probe -- --pretty | Tee-Object -FilePath probe-report.json
      - run: npm ci
        working-directory: app
      - run: npm run fetch:presentmon
        working-directory: app
      # A hosted runner may present no frames. PresentMon then still starts, stops and exits 0 but writes no CSV,
      # so a missing CSV is a warning; a wrong header or a non-zero exit still fails the step.
      - name: PresentMon smoke capture
        shell: pwsh
        run: |
          $pm = Resolve-Path "app/src-tauri/binaries/PresentMon-2.6.0-x64.exe"
          # Keep the desktop changing so DWM presents frames while PresentMon records. The window goes up before PresentMon starts so loading it doesn't eat into the 3 seconds.
          Add-Type -AssemblyName System.Windows.Forms
          $form = New-Object System.Windows.Forms.Form
          $form.Show()
          # The flags the app passes (presentmon_args), on dwm.exe for 3 seconds under a session name of its own.
          $capture = Start-Process -FilePath $pm -NoNewWindow -PassThru -ArgumentList '--process_name dwm.exe --output_file pm-smoke.csv --timed 3 --terminate_after_timed --session_name KestrelCI --stop_existing_session --no_console_stats --set_circular_buffer_size 8192 --track_pc_latency'
          $null = $capture.Handle
          for ($i = 0; $i -lt 60; $i++) { $form.Left = 100 + ($i % 20) * 10; [System.Windows.Forms.Application]::DoEvents(); Start-Sleep -Milliseconds 100 }
          $form.Close()
          if (-not $capture.WaitForExit(30000)) { $capture.Kill(); throw "PresentMon didn't finish" }
          if ($capture.ExitCode -ne 0) { throw "PresentMon exited with code $($capture.ExitCode)" }
          if (Test-Path pm-smoke.csv) {
            $header = Get-Content pm-smoke.csv -TotalCount 1
            if (-not $header.Contains("MsBetweenPresents")) { throw "Unexpected PresentMon header: $header" }
            Write-Host "PresentMon header OK; frames captured: $((Get-Content pm-smoke.csv).Count - 1)"
          } else {
            Write-Host "::warning::PresentMon ran and exited 0 but recorded no frames on this runner, so the CSV header wasn't checked."
          }
      - run: npx tauri build
        working-directory: app
      - run: cargo clippy -p kestrel --locked --all-targets -- -D warnings
      - name: Check the admin manifest
        shell: pwsh
        run: |
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("target/release/Kestrel.exe"))
          if (-not $text.Contains('level="requireAdministrator"')) { throw "Kestrel.exe is missing the requireAdministrator manifest" }
      - name: Check the installer and the bundled PresentMon
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis/Kestrel_*_x64-setup.exe" -ErrorAction SilentlyContinue
          if (-not $installer) { throw "The installer was not built" }
          if (-not (Test-Path "target/release/presentmon/PresentMon.exe")) { throw "PresentMon isn't next to Kestrel.exe" }
          if (-not (Test-Path "target/release/presentmon/LICENSE.txt")) { throw "PresentMon's licence isn't bundled" }
      - uses: actions/upload-artifact@v7
        with:
          name: kestrel-windows
          path: |
            target/release/bundle/nsis/*.exe
            probe-report.json
