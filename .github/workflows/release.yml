name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch head on 2026-10-09)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run fetch:presentmon
        working-directory: app
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Kestrel ${{ github.ref_name }} (test build)
          releaseBody: |
            Test build. It changes nothing on your PC; it only saves benchmark results in its own folder.

            Install: download `Kestrel_*_x64-setup.exe` below and run it. Test builds aren't signed yet, so Windows may show "Windows protected your PC". Click More info → Run anyway.

            Kestrel is not affiliated with Riot Games. VALORANT is a trademark of Riot Games, Inc.
          prerelease: true
          releaseDraft: false
